
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d0a">
<title>OLD BOYS | Football Club</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d0a;color:#f4f6f4;font-family:Arial,sans-serif;padding:20px}
.wrap{max-width:850px;margin:auto}
header{text-align:center;padding:25px 0}
.logo{color:#b7ff36;font-size:35px;font-weight:900;letter-spacing:5px}
.sub{color:#89938b;font-size:11px;letter-spacing:3px;margin-top:8px}
.panel{background:#141b16;border:1px solid #29342c;border-radius:15px;padding:20px;margin:15px 0}
h2{font-size:19px;margin:0 0 15px}
input,select{width:100%;padding:13px;margin:7px 0 12px;background:#090f0b;border:1px solid #354238;border-radius:8px;color:white;font-size:15px}
label{font-size:12px;color:#b7c2b8}
button{border:0;border-radius:8px;padding:12px 16px;background:#b7ff36;color:#10150b;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#303b32;color:white}
.danger{background:#612d2d;color:white}
.hidden{display:none!important}
.message{font-size:13px;color:#b7ff36;margin-top:10px;white-space:pre-wrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#0c120e;padding:15px;border-radius:10px;text-align:center}
.stat strong{display:block;color:#b7ff36;font-size:24px}
.stat span{font-size:11px;color:#a4afa6}
.player{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid #303a32}
.player img{width:55px;height:55px;border-radius:10px;object-fit:cover;background:#303a32}
.player-info{flex:1;min-width:0}
.player-info strong{display:block;overflow-wrap:anywhere}
.player-info small{color:#9eaaa0;display:block;margin-top:5px}
.actions{display:flex;gap:6px}
.actions button{padding:9px;font-size:12px}
.att-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #303a32}
.att-row strong{flex:1;min-width:0;font-size:14px}
.att-row select{width:145px;margin:0;padding:10px;font-size:13px}
@media(max-width:480px){
 body{padding:12px}
 .panel{padding:15px}
 .actions{flex-direction:column}
 .player img{width:48px;height:48px}
 .att-row{gap:7px}
 .att-row select{width:130px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">OLD BOYS</div>
  <div class="sub">FOOTBALL CLUB MANAGEMENT</div>
</header>

<section id="login" class="panel">
  <h2>Đăng nhập</h2>
  <label>Email</label>
  <input id="email" type="email" placeholder="Email tài khoản">
  <label>Mật khẩu</label>
  <input id="password" type="password" placeholder="Mật khẩu">
  <button id="loginBtn" style="width:100%">ĐĂNG NHẬP</button>
  <div id="loginMsg" class="message"></div>
</section>

<main id="app" class="hidden">
  <div class="panel top">
    <div>
      <strong>QUẢN LÝ ĐỘI BÓNG</strong>
      <div id="account" class="sub"></div>
    </div>
    <button id="logout" class="secondary">Đăng xuất</button>
  </div>

  <div class="panel">
    <div class="stats">
      <div class="stat"><strong id="total">0</strong><span>Tổng cầu thủ</span></div>
      <div class="stat"><strong id="active">0</strong><span>Đang hoạt động</span></div>
      <div class="stat"><strong id="elo">0</strong><span>ELO trung bình</span></div>
    </div>
  </div>

  <section class="panel">
    <h2 id="formTitle">Thêm cầu thủ</h2>
    <form id="playerForm">
      <input type="hidden" id="playerId">
      <label>Họ và tên</label>
      <input id="fullName" required placeholder="Tên cầu thủ">
      <label>Số áo</label>
      <input id="jersey" type="number" min="0" placeholder="Ví dụ: 10">
      <label>Vị trí</label>
      <select id="position">
        <option value="">Chọn vị trí</option>
        <option>Thủ môn</option>
        <option>Hậu vệ</option>
        <option>Tiền vệ</option>
        <option>Tiền đạo</option>
        <option>Đa năng</option>
      </select>
      <label>Ảnh cầu thủ</label>
<input id="photoFile" type="file" accept="image/*">
<img id="photoPreview" class="hidden" alt="Ảnh xem trước"
     style="width:110px;height:110px;object-fit:cover;border-radius:12px;margin:5px 0 12px">
<div id="photoMsg" class="message"></div>
      <label>Điểm ELO</label>
      <input id="rating" type="number" min="0" value="1000">
      <label>Trạng thái</label>
      <select id="status">
        <option value="true">Đang hoạt động</option>
        <option value="false">Không hoạt động</option>
      </select>
      <button id="saveBtn" type="submit" style="width:100%">LƯU CẦU THỦ</button>
      <button id="cancelEdit" type="button" class="secondary hidden" style="width:100%;margin-top:8px">HỦY CHỈNH SỬA</button>
    </form>
    <div id="formMsg" class="message"></div>
  </section>

  <section class="panel">
    <div class="top">
      <h2>Danh sách cầu thủ</h2>
      <button id="refresh" class="secondary">Làm mới</button>
    </div>
    <input id="search" placeholder="Tìm tên cầu thủ...">
    <div id="players">Đang tải danh sách...</div>
  </section>

  <section class="panel" id="attendancePanel">
    <div class="top">
      <h2>Điểm danh buổi đá</h2>
      <button id="reloadSessions" class="secondary" type="button">Làm mới</button>
    </div>
    <label>Tên buổi đá</label>
    <input id="sessionTitle" value="Buổi đá OLD BOYS" placeholder="Tên buổi đá">
    <div class="top" style="gap:12px">
      <div style="flex:1;min-width:140px">
        <label>Ngày đá</label>
        <input id="sessionDate" type="date">
      </div>
      <div style="flex:1;min-width:120px">
        <label>Giờ bắt đầu</label>
        <input id="sessionTime" type="time">
      </div>
    </div>
    <button id="createSession" type="button" style="width:100%">TẠO BUỔI ĐIỂM DANH</button>
    <div id="sessionMsg" class="message"></div>
    <div style="margin-top:18px">
      <label>Chọn buổi cần điểm danh / xem lại</label>
      <select id="sessionSelect">
        <option value="">Chưa có buổi đá</option>
      </select>
    </div>
    <div id="attendanceList" style="margin-top:12px">Chọn một buổi đá để điểm danh.</div>
    <button id="saveAttendance" type="button" style="width:100%;margin-top:14px">LƯU ĐIỂM DANH</button>
    <div id="attendanceMsg" class="message"></div>
  </section>
 <section class="panel" id="matchesPanel">
  <h2>QUẢN LÝ TRẬN ĐẤU</h2>

  <label>Tên trận đấu</label>
  <input id="matchTitle" value="Trận đấu OLD BOYS">

  <div class="top">
    <div style="flex:1;min-width:130px">
      <label>Ngày đấu</label>
      <input id="matchDate" type="date">
    </div>
    <div style="flex:1;min-width:110px">
      <label>Giờ đấu</label>
      <input id="matchTime" type="time">
    </div>
  </div>

  <label>Thể thức</label>
  <select id="matchFormat">
    <option value="5v5">5 người / đội</option>
    <option value="7v7">7 người / đội</option>
  </select>

  <h2 style="margin-top:15px">ĐỘI A</h2>
  <input id="teamAName" value="ĐỘI A" placeholder="Tên đội A">
  <label>Chọn cầu thủ đội A</label>
  <div id="teamAPlayers" class="match-player-list"></div>

  <h2 style="margin-top:15px">ĐỘI B</h2>
  <input id="teamBName" value="ĐỘI B" placeholder="Tên đội B">
  <label>Chọn cầu thủ đội B</label>
  <div id="teamBPlayers" class="match-player-list"></div>

  <button id="createMatch" type="button" style="width:100%;margin-top:15px">
    TẠO TRẬN ĐẤU
  </button>

  <div id="matchMsg" class="message"></div>
  <div id="matchHistory" style="margin-top:18px"></div>
</section>
 
</main>
</div>

<script>
const SUPABASE_URL = "https://pspiboiojswnonupcyrx.supabase.co";
const SUPABASE_KEY = "sb_publishable_nWVOoHgBNGB9Xln0M4G4jQ_YLynX-Rl";
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $ = id => document.getElementById(id);
let playerData = [];
let sessionData = [];
let attendanceData = [];
 let selectedPhotoFile = null;

$("photoFile").addEventListener("change", e => {
  const file = e.target.files[0];
  selectedPhotoFile = file || null;

  const preview = $("photoPreview");

  if (!file) {
    preview.src = "";
    preview.classList.add("hidden");
    message("photoMsg", "");
    return;
  }

  if (!file.type.startsWith("image/")) {
    selectedPhotoFile = null;
    e.target.value = "";
    preview.classList.add("hidden");
    message("photoMsg", "Vui lòng chọn một tệp hình ảnh.");
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    selectedPhotoFile = null;
    e.target.value = "";
    preview.classList.add("hidden");
    message("photoMsg", "Ảnh vượt quá giới hạn 5 MB.");
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.classList.remove("hidden");
  message("photoMsg", "Đã chọn ảnh. Hãy xem trước trước khi lưu.");
});
 async function uploadPlayerPhoto(file) {
  if (!file) return null;

  const extension = file.name.split(".").pop().toLowerCase();
  const filePath = `${crypto.randomUUID()}.${extension}`;

  const { data, error } = await db.storage
    .from("player-photos")
    .upload(filePath, file, {
      cacheControl: "3600",
      upsert: false,
      contentType: file.type
    });

  if (error) throw error;

  const { data: publicData } = db.storage
    .from("player-photos")
    .getPublicUrl(data.path);

  return publicData.publicUrl;
}

function message(id,text){
  $(id).textContent=text;
}

function localDateValue(){
  const d=new Date();
  const offset=d.getTimezoneOffset();
  return new Date(d.getTime()-offset*60000).toISOString().slice(0,10);
}

async function showApp(user){
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("account").textContent=user.email || "";
  await loadPlayers();
  await loadSessions();
}

function showLogin(){
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
}

async function loadPlayers(){
  $("players").textContent="Đang tải danh sách...";
  const {data,error}=await db.from("players")
    .select("id,full_name,jersey_number,position,photo_url,elo,is_active,created_at")
    .order("full_name");

  if(error){
    $("players").textContent="Không tải được dữ liệu: "+error.message;
    return;
  }

  playerData=data || [];
  renderPlayers();

  $("total").textContent=playerData.length;
  $("active").textContent=playerData.filter(p=>p.is_active).length;

  const avg=playerData.length
    ? Math.round(playerData.reduce((s,p)=>s+(p.elo||0),0)/playerData.length)
    : 0;

  $("elo").textContent=avg;

  if($("sessionSelect").value) await loadAttendance();
}

function renderPlayers(){
  const q=$("search").value.trim().toLowerCase();
  const list=playerData.filter(p=>(p.full_name||"").toLowerCase().includes(q));
  $("players").innerHTML="";

  if(!list.length){
    $("players").textContent="Chưa có cầu thủ phù hợp.";
    return;
  }

  list.forEach(p=>{
    const item=document.createElement("div");
    item.className="player";

    const img=document.createElement("img");
    img.src=p.photo_url || "";
    img.alt="Ảnh cầu thủ";
    img.onerror=()=>{img.style.display="none"};

    const info=document.createElement("div");
    info.className="player-info";

    const name=document.createElement("strong");
    name.textContent=(p.jersey_number!=null?"#"+p.jersey_number+" ":"")+(p.full_name||"");

    const detail=document.createElement("small");
    detail.textContent=(p.position||"Chưa có vị trí")+" · ELO "+(p.elo||0)+" · "+(p.is_active?"Đang hoạt động":"Không hoạt động");

    info.append(name,detail);

    const actions=document.createElement("div");
    actions.className="actions";

    const edit=document.createElement("button");
    edit.className="secondary";
    edit.textContent="Sửa";
    edit.onclick=()=>editPlayer(p);

    const del=document.createElement("button");
    del.className="danger";
    del.textContent="Xóa";
    del.onclick=()=>deletePlayer(p);

    actions.append(edit,del);
    item.append(img,info,actions);
    $("players").append(item);
  });
}

function editPlayer(p){
  $("playerId").value=p.id;
  $("fullName").value=p.full_name||"";
  $("jersey").value=p.jersey_number??"";
  $("position").value=p.position||"";
  $("rating").value=p.elo??1000;
  $("status").value=String(p.is_active);
  $("formTitle").textContent="Chỉnh sửa cầu thủ";
  $("saveBtn").textContent="CẬP NHẬT";
  $("cancelEdit").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}

function resetForm(){
  $("playerForm").reset();
 selectedPhotoFile=null;
$("photoPreview").src="";
$("photoPreview").classList.add("hidden");
message("photoMsg","");
  $("playerId").value="";
  $("rating").value=1000;
  $("status").value="true";
  $("formTitle").textContent="Thêm cầu thủ";
  $("saveBtn").textContent="LƯU CẦU THỦ";
  $("cancelEdit").classList.add("hidden");
  message("formMsg","");
}

$("playerForm").addEventListener("submit",async e=>{
  e.preventDefault();
  $("saveBtn").disabled=true;
  message("formMsg","Đang lưu cầu thủ...");

  try {
    const id=$("playerId").value;
    const existingPlayer=playerData.find(p=>p.id===id);

    let photoUrl=existingPlayer?.photo_url||null;

    if(selectedPhotoFile){
      message("formMsg","Đang tải ảnh lên...");
      photoUrl=await uploadPlayerPhoto(selectedPhotoFile);
    }

    const player={
      full_name:$("fullName").value.trim(),
      jersey_number:$("jersey").value===""?null:Number($("jersey").value),
      position:$("position").value||null,
      photo_url:photoUrl,
      elo:Number($("rating").value)||1000,
      is_active:$("status").value==="true"
    };

    const result=id
      ? await db.from("players").update(player).eq("id",id)
      : await db.from("players").insert(player);

    if(result.error) throw result.error;

    message("formMsg","Đã lưu cầu thủ và ảnh thành công.");
    resetForm();
    await loadPlayers();

  } catch(error) {
    message("formMsg","Lỗi lưu cầu thủ: "+error.message);
  } finally {
    $("saveBtn").disabled=false;
  }
});

async function deletePlayer(p){
  if(!confirm("Bạn có chắc muốn xóa "+p.full_name+"?"))return;

  const {error}=await db.from("players").delete().eq("id",p.id);

  if(error){
    alert("Không xóa được: "+error.message);
    return;
  }

  await loadPlayers();
}

$("cancelEdit").onclick=resetForm;
$("refresh").onclick=loadPlayers;
$("search").addEventListener("input",renderPlayers);

/* ĐIỂM DANH THEO TỪNG BUỔI */

async function loadSessions(){
  $("sessionDate").value=$("sessionDate").value||localDateValue();

  const {data,error}=await db.from("sessions")
    .select("id,title,session_date,start_time,created_at")
    .order("session_date",{ascending:false});

  if(error){
    message("sessionMsg","Không tải được buổi đá: "+error.message);
    return;
  }

  sessionData=data||[];

  const select=$("sessionSelect");
  const previous=select.value;
  select.innerHTML="";

  if(!sessionData.length){
    select.add(new Option("Chưa có buổi đá",""));
    $("attendanceList").textContent="Chưa có buổi đá. Hãy tạo buổi mới ở phía trên.";
    return;
  }

  sessionData.forEach(x=>{
    const label=(x.title||"Buổi đá")+" · "+x.session_date+
      (x.start_time?" · "+String(x.start_time).slice(0,5):"");
    select.add(new Option(label,x.id));
  });

  select.value=sessionData.some(x=>x.id===previous)
    ? previous
    : sessionData[0].id;

  await loadAttendance();
}

async function loadAttendance(){
  const sid=$("sessionSelect").value;

  if(!sid){
    $("attendanceList").textContent="Chọn một buổi đá để điểm danh.";
    return;
  }

  const {data,error}=await db.from("attendance")
    .select("player_id,status,note")
    .eq("session_id",sid);

  if(error){
    $("attendanceList").textContent="Lỗi tải điểm danh: "+error.message;
    return;
  }

  attendanceData=data||[];
  renderAttendance();
}

function renderAttendance(){
  const saved=new Map(attendanceData.map(x=>[x.player_id,x.status]));
  const players=playerData.filter(p=>p.is_active);

  $("attendanceList").innerHTML="";

  if(!players.length){
    $("attendanceList").textContent="Chưa có cầu thủ đang hoạt động.";
    return;
  }

  players.forEach(p=>{
    const row=document.createElement("div");
    row.className="att-row";

    const name=document.createElement("strong");
    name.textContent=(p.jersey_number!=null?"#"+p.jersey_number+" ":"")+(p.full_name||"");

    const select=document.createElement("select");
    select.dataset.playerId=p.id;

    [
      ["present","Có mặt"],
      ["late","Có mặt trễ"],
      ["absent","Vắng mặt"]
    ].forEach(([v,t])=>select.add(new Option(t,v)));

    select.value=saved.get(p.id)||"present";

    row.append(name,select);
    $("attendanceList").append(row);
  });
}

$("createSession").onclick=async()=>{
  const title=$("sessionTitle").value.trim()||"Buổi đá OLD BOYS";
  const date=$("sessionDate").value;

  if(!date){
    message("sessionMsg","Vui lòng chọn ngày đá.");
    return;
  }

  $("createSession").disabled=true;
  message("sessionMsg","Đang tạo buổi đá...");

  const {data,error}=await db.from("sessions").insert({
    title,
    session_date:date,
    start_time:$("sessionTime").value||null
  }).select("id").single();

  $("createSession").disabled=false;

  if(error){
    message("sessionMsg","Không tạo được: "+error.message);
    return;
  }

  message("sessionMsg","Đã tạo buổi điểm danh thành công.");

  await loadSessions();
  $("sessionSelect").value=data.id;
  await loadAttendance();
};

$("sessionSelect").onchange=loadAttendance;
$("reloadSessions").onclick=loadSessions;

$("saveAttendance").onclick=async()=>{
  const sid=$("sessionSelect").value;

  if(!sid){
    message("attendanceMsg","Hãy tạo hoặc chọn một buổi đá trước.");
    return;
  }

  const rows=[
    ...$("attendanceList").querySelectorAll("select[data-player-id]")
  ].map(el=>({
    session_id:sid,
    player_id:el.dataset.playerId,
    status:el.value
  }));

  if(!rows.length){
    message("attendanceMsg","Chưa có cầu thủ để điểm danh.");
    return;
  }

  $("saveAttendance").disabled=true;
  message("attendanceMsg","Đang lưu điểm danh...");

  const {error}=await db.from("attendance")
    .upsert(rows,{onConflict:"session_id,player_id"});

  $("saveAttendance").disabled=false;

  if(error){
    message("attendanceMsg","Lỗi lưu điểm danh: "+error.message);
    return;
  }

  attendanceData=rows.map(x=>({
    player_id:x.player_id,
    status:x.status
  }));

  message("attendanceMsg","Đã lưu điểm danh thành công.");
};

/* ĐĂNG NHẬP VÀ ĐĂNG XUẤT */

$("loginBtn").onclick=async()=>{
  $("loginBtn").disabled=true;
  message("loginMsg","Đang đăng nhập...");

  const {data,error}=await db.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });

  $("loginBtn").disabled=false;

  if(error){
    message("loginMsg","Đăng nhập không thành công: "+error.message);
    return;
  }

  await showApp(data.user);
};

$("logout").onclick=async()=>{
  await db.auth.signOut();
  showLogin();
};

async function start(){
  const {data}=await db.auth.getSession();
  if(data.session)await showApp(data.session.user);
}

db.auth.onAuthStateChange((event,session)=>{
  if(event==="SIGNED_OUT")showLogin();
});
/* CHỌN CẦU THỦ CHO TRẬN ĐẤU */

let matchTeamA = new Set();
let matchTeamB = new Set();

function renderMatchPlayerOptions() {
  const a = $("teamAPlayers");
  const b = $("teamBPlayers");

  if (!a || !b) return;

  function renderList(container, team, otherTeam) {
    container.innerHTML = "";

    const available = playerData.filter(p =>
      p.is_active && (!otherTeam.has(p.id) || team.has(p.id))
    );

    if (!available.length) {
      container.textContent = "Chưa có cầu thủ phù hợp.";
      return;
    }

    available.forEach(p => {
      const label = document.createElement("label");
      label.style.cssText =
        "display:flex;align-items:center;gap:12px;padding:10px;margin:7px 0;background:#0c120e;border:1px solid #354238;border-radius:10px;cursor:pointer";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = team.has(p.id);
      checkbox.style.cssText = "width:20px;height:20px;margin:0;flex-shrink:0";

      checkbox.addEventListener("change", () => {
        const limit = $("matchFormat").value === "5v5" ? 5 : 7;

        if (checkbox.checked) {
          if (team.size >= limit) {
            checkbox.checked = false;
            message("matchMsg", "Mỗi đội chỉ được chọn tối đa " + limit + " cầu thủ.");
            return;
          }

          team.add(p.id);
          otherTeam.delete(p.id);
        } else {
          team.delete(p.id);
        }

        message("matchMsg", "");
        renderMatchPlayerOptions();
      });

      const img = document.createElement("img");
      img.src = p.photo_url || "";
      img.alt = "";
      img.style.cssText =
        "width:45px;height:45px;object-fit:cover;border-radius:8px;background:#303a32;flex-shrink:0";

      img.onerror = () => {
        img.style.display = "none";
      };

      const info = document.createElement("span");
      info.style.cssText = "flex:1;min-width:0;color:white;font-size:14px";

      const name = document.createElement("strong");
      name.textContent =
        (p.jersey_number != null ? "#" + p.jersey_number + " " : "") +
        p.full_name;

      info.appendChild(name);
      label.append(checkbox, img, info);
      container.appendChild(label);
    });
  }

  renderList(a, matchTeamA, matchTeamB);
  renderList(b, matchTeamB, matchTeamA);
}

$("matchFormat").addEventListener("change", () => {
  const limit = $("matchFormat").value === "5v5" ? 5 : 7;

  [matchTeamA, matchTeamB].forEach(team => {
    while (team.size > limit) {
      team.delete([...team].pop());
    }
  });

  message("matchMsg", "");
  renderMatchPlayerOptions();
});

const originalLoadPlayers = loadPlayers;

loadPlayers = async function() {
  await originalLoadPlayers();
  renderMatchPlayerOptions();
};

$("matchDate").value = localDateValue();
 
/* LƯU TRẬN ĐẤU VÀ HIỂN THỊ LỊCH SỬ */

async function loadMatchHistory() {
  const box = $("matchHistory");
  box.textContent = "Đang tải lịch sử trận đấu...";

  const { data, error } = await db
    .from("matches")
    .select("*")
    .order("match_date", { ascending: false })
    .limit(30);

  if (error) {
    box.textContent = "Không tải được lịch sử: " + error.message;
    return;
  }

  box.innerHTML = "";

  const heading = document.createElement("h3");
  heading.textContent = "LỊCH SỬ TRẬN ĐẤU";
  box.appendChild(heading);

  if (!data || !data.length) {
    const empty = document.createElement("p");
    empty.textContent = "Chưa có trận đấu nào.";
    box.appendChild(empty);
    return;
  }

  data.forEach(match => {
    const card = document.createElement("div");
    card.style.cssText =
      "padding:14px;margin:10px 0;background:#0c120e;border:1px solid #354238;border-radius:12px";

    const title = document.createElement("strong");
    title.textContent = match.title || "Trận đấu OLD BOYS";

    const date = document.createElement("div");
    date.style.cssText = "margin-top:7px;color:#aaa;font-size:13px";
    date.textContent =
      (match.match_date || "") +
      (match.start_time ? " · " + match.start_time.slice(0, 5) : "") +
      " · " + match.format;

    const score = document.createElement("div");
    score.style.cssText =
      "display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-size:16px;font-weight:bold";

    const teamA = document.createElement("span");
    teamA.textContent = match.team_a_name || "ĐỘI A";

    const result = document.createElement("span");
    result.textContent =
      (match.score_a ?? 0) + " - " + (match.score_b ?? 0);

    const teamB = document.createElement("span");
    teamB.textContent = match.team_b_name || "ĐỘI B";

    score.append(teamA, result, teamB);

    const status = document.createElement("div");
    status.style.cssText = "margin-top:8px;color:#aaa;font-size:12px";
    status.textContent =
      match.status === "completed" ? "Đã hoàn thành" : "Chưa hoàn thành";

    card.append(title, date, score, status);
    box.appendChild(card);
  });
}

$("createMatch").addEventListener("click", async () => {
  const button = $("createMatch");
  const title = $("matchTitle").value.trim();
  const date = $("matchDate").value;
  const time = $("matchTime").value;
  const teamAName = $("teamAName").value.trim() || "ĐỘI A";
  const teamBName = $("teamBName").value.trim() || "ĐỘI B";

  if (!title || !date) {
    message("matchMsg", "Vui lòng nhập tên trận và ngày đấu.");
    return;
  }

  if (!matchTeamA.size || !matchTeamB.size) {
    message("matchMsg", "Vui lòng chọn cầu thủ cho cả hai đội.");
    return;
  }

  button.disabled = true;
  button.textContent = "ĐANG LƯU...";

  try {
    const { data: match, error } = await db
      .from("matches")
      .insert({
        title: title,
        match_date: date,
        start_time: time || null,
        format: $("matchFormat").value,
        team_a_name: teamAName,
        team_b_name: teamBName,
        score_a: 0,
        score_b: 0,
        status: "scheduled"
      })
      .select()
      .single();

    if (error) throw error;

    const players = [
      ...[...matchTeamA].map(id => ({
        match_id: match.id,
        player_id: id,
        team: "A"
      })),
      ...[...matchTeamB].map(id => ({
        match_id: match.id,
        player_id: id,
        team: "B"
      }))
    ];

    const { error: playerError } = await db
      .from("match_players")
      .insert(players);

    if (playerError) {
      await db.from("matches").delete().eq("id", match.id);
      throw playerError;
    }

    matchTeamA.clear();
    matchTeamB.clear();
    renderMatchPlayerOptions();

    message("matchMsg", "Đã tạo và lưu trận đấu thành công!");
    await loadMatchHistory();

  } catch (error) {
    message("matchMsg", "Không lưu được trận đấu: " + error.message);
  } finally {
    button.disabled = false;
    button.textContent = "TẠO TRẬN ĐẤU";
  }
});

start();
</script>
