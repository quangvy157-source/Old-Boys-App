
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d0a">
<title>OLD BOYS | Football Club</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d0a;color:#f4f6f4;font-family:Arial,sans-serif;padding:20px}
.wrap{max-width:850px;margin:auto}
header{text-align:center;padding:25px 0}
.logo{color:#b7ff36;font-size:35px;font-weight:900;letter-spacing:5px}
.sub{color:#89938b;font-size:11px;letter-spacing:3px;margin-top:8px}
.panel{background:#141b16;border:1px solid #29342c;border-radius:15px;padding:20px;margin:15px 0}
h2{font-size:19px;margin:0 0 15px}
input,select{width:100%;padding:13px;margin:7px 0 12px;background:#090f0b;border:1px solid #354238;border-radius:8px;color:white;font-size:15px}
label{font-size:12px;color:#b7c2b8}
button{border:0;border-radius:8px;padding:12px 16px;background:#b7ff36;color:#10150b;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#303b32;color:white}
.danger{background:#612d2d;color:white}
.hidden{display:none!important}
.message{font-size:13px;color:#b7ff36;margin-top:10px;white-space:pre-wrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#0c120e;padding:15px;border-radius:10px;text-align:center}
.stat strong{display:block;color:#b7ff36;font-size:24px}
.stat span{font-size:11px;color:#a4afa6}
.player{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid #303a32}
.player img{width:55px;height:55px;border-radius:10px;object-fit:cover;background:#303a32}
.player-info{flex:1;min-width:0}
.player-info strong{display:block;overflow-wrap:anywhere}
.player-info small{color:#9eaaa0;display:block;margin-top:5px}
.actions{display:flex;gap:6px}
.actions button{padding:9px;font-size:12px}
.att-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #303a32}
.att-row strong{flex:1;min-width:0;font-size:14px}
.att-row select{width:145px;margin:0;padding:10px;font-size:13px}
 .modal-overlay{
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,.84);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
  overflow-y:auto
}
.modal-card{
  width:100%;
  max-width:680px;
  max-height:92vh;
  overflow-y:auto;
  background:#111a13;
  border:1px solid #526344;
  border-radius:18px;
  padding:18px;
  box-shadow:0 20px 70px rgba(0,0,0,.55)
}
.modal-overlay.hidden{display:none!important}
.match-card{
  padding:15px;
  margin:12px 0;
  background:linear-gradient(145deg,#17231a,#0c120e);
  border:1px solid #354238;
  border-radius:14px
}
.match-card-score{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
  margin:15px 0;
  text-align:center
}
.match-card-score strong{
  font-size:25px;
  color:#b7ff36;
  white-space:nowrap
}
.match-card-score span{
  font-size:13px;
  font-weight:bold;
  overflow-wrap:anywhere
}
.goal-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin:8px 0;
  padding:10px;
  background:#182019;
  border-radius:10px
}
.goal-name{flex:1;min-width:0;font-size:13px}
.goal-count{
  min-width:28px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  color:#b7ff36
}
.goal-btn{
  width:38px;
  height:38px;
  padding:0;
  font-size:22px;
  border-radius:9px
}
.goal-btn.minus{background:#303b32;color:#fff}
.score-live{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:12px 0
}
.score-live>div{
  padding:12px;
  background:#0c120e;
  border-radius:10px;
  text-align:center
}
.score-live strong{
  display:block;
  font-size:30px;
  color:#b7ff36
}
@media(max-width:480px){
 body{padding:12px}
 .panel{padding:15px}
 .actions{flex-direction:column}
 .player img{width:48px;height:48px}
 .att-row{gap:7px}
 .att-row select{width:130px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">OLD BOYS</div>
  <div class="sub">FOOTBALL CLUB MANAGEMENT</div>

<section id="login" class="panel">

<main id="app" class="hidden">

  <section class="panel">

      <label>Vị trí</label>
      <select id="position">
        <option value="">Chọn vị trí</option>
        <option>Thủ môn</option>
        <option>Hậu vệ</option>
        <option>Tiền vệ</option>
        <option>Tiền đạo</option>
        <option>Đa năng</option>
      </select>
      <label>Ảnh cầu thủ</label>
<input id="photoFile" type="file" accept="image/*">
<img id="photoPreview" class="hidden" alt="Ảnh xem trước"
     style="width:110px;height:110px;object-fit:cover;border-radius:12px;margin:5px 0 12px">
<div id="photoMsg" class="message"></div>
      <label>Điểm ELO</label>
      <input id="rating" type="number" min="0" value="1000">
      <label>Trạng thái</label>
      <select id="status">
        <option value="true">Đang hoạt động</option>
        <option value="false">Không hoạt động</option>
      </select>
      <button id="saveBtn" type="submit" style="width:100%">LƯU CẦU THỦ</button>

    </form>
    <div id="formMsg" class="message"></div>
  </section>

  <section class="panel">
    <div class="top">

      <button id="refresh" class="secondary">Làm mới</button>
    </div>
    <input id="search" placeholder="Tìm tên cầu thủ...">
    <div id="players">Đang tải danh sách...</div>
  </section>

  <section class="panel" id="matchesPanel">

      <h2>QUẢN LÝ TRẬN ĐẤU</h2>

    </div>
    <button type="button" id="openCreateMatch">+ TẠO TRẬN ĐẤU</button>

</section>

<div id="createMatchModal" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="top">
      <h2>TẠO TRẬN ĐẤU</h2>
      <button type="button" class="secondary" id="closeCreateMatch">ĐÓNG</button>
    </div>

    <label>Tên trận đấu</label>
    <input id="matchTitle" value="Trận đấu OLD BOYS">

    <div class="top">
      <div style="flex:1">
        <label>Ngày đấu</label>
        <input id="matchDate" type="date">
      </div>
      <div style="flex:1">
        <label>Giờ đấu</label>
        <input id="matchTime" type="time">
      </div>

    <label>Thể thức</label>
    <select id="matchFormat">
      <option value="5v5">5 người / đội</option>
      <option value="7v7">7 người / đội</option>

    <h2>ĐỘI A</h2>
    <input id="teamAName" value="ĐỘI A" placeholder="Tên đội A">

    <div id="teamAPlayers" class="match-player-list"></div>

    <button id="createMatch" type="button" style="width:100%;margin-top:15px">
      TẠO TRẬN ĐẤU

</div>

<div id="matchDetailModal" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="top">
      <div>
        <div class="logo" style="font-size:22px">OLD BOYS</div>
        <div class="sub">MATCH CENTER</div>
      </div>
      <button type="button" class="secondary" id="closeMatchDetail">ĐÓNG</button>
    </div>
    <div id="matchDetailContent"></div>
  </div>
</div>
 
</main>

<script>
const SUPABASE_URL = "https://pspiboiojswnonupcyrx.supabase.co";
const SUPABASE_KEY = "sb_publishable_nWVOoHgBNGB9Xln0M4G4jQ_YLynX-Rl";
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $ = id => document.getElementById(id);
let playerData = [];
let sessionData = [];
let attendanceData = [];
 let selectedPhotoFile = null;

$("photoFile").addEventListener("change", e => {
  const file = e.target.files[0];
  selectedPhotoFile = file || null;

  const preview = $("photoPreview");

  if (!file) {
    preview.src = "";
    preview.classList.add("hidden");
    message("photoMsg", "");
    return;
  }

  if (!file.type.startsWith("image/")) {
    selectedPhotoFile = null;
    e.target.value = "";
    preview.classList.add("hidden");
    message("photoMsg", "Vui lòng chọn một tệp hình ảnh.");
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    selectedPhotoFile = null;
    e.target.value = "";
    preview.classList.add("hidden");
    message("photoMsg", "Ảnh vượt quá giới hạn 5 MB.");
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.classList.remove("hidden");
  message("photoMsg", "Đã chọn ảnh. Hãy xem trước trước khi lưu.");
});
 async function uploadPlayerPhoto(file) {
  if (!file) return null;

  const extension = file.name.split(".").pop().toLowerCase();
  const filePath = `${crypto.randomUUID()}.${extension}`;

  const { data, error } = await db.storage
    .from("player-photos")
    .upload(filePath, file, {
      cacheControl: "3600",
      upsert: false,
      contentType: file.type
    });

  if (error) throw error;

  const { data: publicData } = db.storage
    .from("player-photos")
    .getPublicUrl(data.path);

  return publicData.publicUrl;
}

function message(id,text){
  $(id).textContent=text;
}

function localDateValue(){
  const d=new Date();
  const offset=d.getTimezoneOffset();
  return new Date(d.getTime()-offset*60000).toISOString().slice(0,10);
}

async function showApp(user){
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("account").textContent=user.email || "";
  await loadPlayers();
 await loadMatchHistory();
}

function showLogin(){
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
}

async function loadPlayers(){
  $("players").textContent="Đang tải danh sách...";
  const {data,error}=await db.from("players")
    .select("id,full_name,jersey_number,position,photo_url,elo,is_active,created_at")
    .order("full_name");

  if(error){
    $("players").textContent="Không tải được dữ liệu: "+error.message;
    return;
  }

  playerData=data || [];
  renderPlayers();

  $("total").textContent=playerData.length;
  $("active").textContent=playerData.filter(p=>p.is_active).length;

  const avg=playerData.length
    ? Math.round(playerData.reduce((s,p)=>s+(p.elo||0),0)/playerData.length)
    : 0;

  $("elo").textContent=avg;

  if($("sessionSelect")?.value) await loadAttendance();
}


function renderPlayers(){
  const q=$("search").value.trim().toLowerCase();
  const list=playerData.filter(p=>(p.full_name||"").toLowerCase().includes(q));
  $("players").innerHTML="";

  if(!list.length){
    $("players").textContent="Chưa có cầu thủ phù hợp.";
    return;
  }

  list.forEach(p=>{
    const item=document.createElement("div");
    item.className="player";

    const img=document.createElement("img");
    img.src=p.photo_url || "";
    img.alt="Ảnh cầu thủ";
    img.onerror=()=>{img.style.display="none"};

    const info=document.createElement("div");
    info.className="player-info";

    const name=document.createElement("strong");
    name.textContent=(p.jersey_number!=null?"#"+p.jersey_number+" ":"")+(p.full_name||"");
    name.style.cursor="pointer";
    name.title="Bấm để xem hồ sơ cầu thủ";
    name.addEventListener("click",()=>openPlayerDetail(p));

    const detail=document.createElement("small");
    detail.textContent=(p.position||"Chưa có vị trí")+" · ELO "+(p.elo||0)+" · "+(p.is_active?"Đang hoạt động":"Không hoạt động");

    info.append(name,detail);

    const actions=document.createElement("div");
    actions.className="actions";

    const view=document.createElement("button");
    view.type="button";
    view.className="secondary";
    view.textContent="Chi tiết";
    view.onclick=()=>openPlayerDetail(p);

    const edit=document.createElement("button");
    edit.className="secondary";
    edit.textContent="Sửa";
    edit.onclick=()=>editPlayer(p);

    const del=document.createElement("button");
    del.className="danger";
    del.textContent="Xóa";
    del.onclick=()=>deletePlayer(p);

    actions.append(view,edit,del);
    item.append(img,info,actions);
    $("players").append(item);
  });
}

async function openPlayerDetail(p){
  const modal=$("matchDetailModal");
  const content=$("matchDetailContent");
  const subtitle=modal.querySelector(".sub");

  subtitle.textContent="PLAYER PROFILE · OLD BOYS";
  content.innerHTML="<p>Đang tải hồ sơ cầu thủ...</p>";
  modal.classList.remove("hidden");

  const {data:appearances,error:appearanceError}=await db
    .from("match_players")
    .select("match_id,team")
    .eq("player_id",p.id);

  if(appearanceError){
    content.textContent="Không tải được lịch sử thi đấu: "+appearanceError.message;
    return;
  }

  const {data:goalRows,error:goalError}=await db
    .from("match_scorers")
    .select("match_id,goals,team")
    .eq("player_id",p.id);

  if(goalError){
    content.textContent="Không tải được thống kê bàn thắng: "+goalError.message;
    return;
  }

  const played=appearances||[];
  const goals=(goalRows||[]).reduce((sum,x)=>sum+(Number(x.goals)||0),0);
  const matchIds=[...new Set(played.map(x=>x.match_id))];
  let matches=[];

  if(matchIds.length){
    const {data:matchData,error:matchError}=await db
      .from("matches")
      .select("id,title,match_date,start_time,format,match_format,team_a_name,team_b_name,score_a,score_b")
      .in("id",matchIds)
      .order("match_date",{ascending:false});

    if(matchError){
      content.textContent="Không tải được danh sách trận đấu: "+matchError.message;
      return;
    }
    matches=matchData||[];
  }

  content.innerHTML="";

  const profile=document.createElement("div");
  profile.style.cssText="display:flex;align-items:center;gap:14px;margin:18px 0;padding:14px;background:#0c120e;border-radius:12px";

  if(p.photo_url){
    const photo=document.createElement("img");
    photo.src=p.photo_url;
    photo.alt="Ảnh "+p.full_name;
    photo.style.cssText="width:82px;height:82px;object-fit:cover;border-radius:12px;background:#303a32";
    photo.onerror=()=>photo.style.display="none";
    profile.appendChild(photo);
  }

  const identity=document.createElement("div");
  identity.style.cssText="min-width:0";

  const playerName=document.createElement("h2");
  playerName.style.cssText="margin:0 0 6px;font-size:20px";
  playerName.textContent=(p.jersey_number!=null?"#"+p.jersey_number+" ":"")+(p.full_name||"");

  const position=document.createElement("div");
  position.style.cssText="color:#aab5ac;font-size:13px";
  position.textContent=(p.position||"Chưa cập nhật vị trí")+" · "+(p.is_active?"Đang hoạt động":"Không hoạt động");

  identity.append(playerName,position);
  profile.appendChild(identity);
  content.appendChild(profile);

  const stats=document.createElement("div");
  stats.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0";

  [[played.length,"TRẬN ĐÃ ĐÁ"],[goals,"BÀN THẮNG"]].forEach(([value,label])=>{
    const tile=document.createElement("div");
    tile.style.cssText="padding:15px;background:#17221a;border:1px solid #354238;border-radius:10px;text-align:center";

    const number=document.createElement("strong");
    number.style.cssText="display:block;font-size:26px;color:#d9f99d";
    number.textContent=value;

    const caption=document.createElement("small");
    caption.style.cssText="color:#aab5ac";
    caption.textContent=label;

    tile.append(number,caption);
    stats.appendChild(tile);
  });

  content.appendChild(stats);

  const historyTitle=document.createElement("h3");
  historyTitle.textContent="LỊCH SỬ THI ĐẤU";
  historyTitle.style.marginTop="22px";
  content.appendChild(historyTitle);

  if(!matches.length){
    const empty=document.createElement("p");
    empty.style.color="#aab5ac";
    empty.textContent="Cầu thủ chưa có dữ liệu tham gia trận đấu.";
    content.appendChild(empty);
    return;
  }

  matches.forEach(match=>{
    const card=document.createElement("div");
    card.style.cssText="padding:12px;margin:9px 0;background:#0c120e;border:1px solid #354238;border-radius:10px";

    const title=document.createElement("strong");
    title.textContent=match.title||"Trận đấu OLD BOYS";

    const date=document.createElement("div");
    date.style.cssText="margin-top:5px;color:#aab5ac;font-size:12px";
    date.textContent=(match.match_date||"")+(match.start_time?" · "+String(match.start_time).slice(0,5):"")+" · "+(match.format||match.match_format||"");

    const score=document.createElement("div");
    score.style.cssText="margin-top:9px;font-weight:700";
    score.textContent=(match.team_a_name||"ĐỘI A")+"  "+(match.score_a??0)+" - "+(match.score_b??0)+"  "+(match.team_b_name||"ĐỘI B");

    card.append(title,date,score);
    content.appendChild(card);
  });
}

function editPlayer(p){
  $("playerId").value=p.id;
  $("fullName").value=p.full_name||"";
  $("jersey").value=p.jersey_number??"";
  $("position").value=p.position||"";
  $("rating").value=p.elo??1000;
  $("status").value=String(p.is_active);
  $("formTitle").textContent="Chỉnh sửa cầu thủ";
  $("saveBtn").textContent="CẬP NHẬT";
  $("cancelEdit").classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}

function resetForm(){
  $("playerForm").reset();
 selectedPhotoFile=null;
$("photoPreview").src="";
$("photoPreview").classList.add("hidden");
message("photoMsg","");
  $("playerId").value="";
  $("rating").value=1000;
  $("status").value="true";
  $("formTitle").textContent="Thêm cầu thủ";
  $("saveBtn").textContent="LƯU CẦU THỦ";
  $("cancelEdit").classList.add("hidden");
  message("formMsg","");
}

$("playerForm").addEventListener("submit",async e=>{
  e.preventDefault();
  $("saveBtn").disabled=true;
  message("formMsg","Đang lưu cầu thủ...");

  try {
    const id=$("playerId").value;
    const existingPlayer=playerData.find(p=>p.id===id);

    let photoUrl=existingPlayer?.photo_url||null;

    if(selectedPhotoFile){
      message("formMsg","Đang tải ảnh lên...");
      photoUrl=await uploadPlayerPhoto(selectedPhotoFile);
    }

    const player={
      full_name:$("fullName").value.trim(),
      jersey_number:$("jersey").value===""?null:Number($("jersey").value),
      position:$("position").value||null,
      photo_url:photoUrl,
      elo:Number($("rating").value)||1000,
      is_active:$("status").value==="true"
    };

    const result=id
      ? await db.from("players").update(player).eq("id",id)
      : await db.from("players").insert(player);

    if(result.error) throw result.error;

    message("formMsg","Đã lưu cầu thủ và ảnh thành công.");
    resetForm();
    await loadPlayers();

  } catch(error) {
    message("formMsg","Lỗi lưu cầu thủ: "+error.message);
  } finally {
    $("saveBtn").disabled=false;
  }
});

async function deletePlayer(p){

async function loadSessions(){
  $("sessionDate").value=$("sessionDate").value||localDateValue();

  const {data,error}=await db.from("sessions")
    .select("id,title,session_date,start_time,created_at")
    .order("session_date",{ascending:false});

  if(error){
    message("sessionMsg","Không tải được buổi đá: "+error.message);
    return;
  }

  sessionData=data||[];

  const select=$("sessionSelect");
  const previous=select.value;
  select.innerHTML="";

  if(!sessionData.length){
    select.add(new Option("Chưa có buổi đá",""));
    $("attendanceList").textContent="Chưa có buổi đá. Hãy tạo buổi mới ở phía trên.";
    return;
  }

  sessionData.forEach(x=>{
    const label=(x.title||"Buổi đá")+" · "+x.session_date+
      (x.start_time?" · "+String(x.start_time).slice(0,5):"");
    select.add(new Option(label,x.id));
  });

  select.value=sessionData.some(x=>x.id===previous)
    ? previous
    : sessionData[0].id;

  await loadAttendance();
}

async function loadAttendance(){
  const sid=$("sessionSelect").value;

  if(!sid){
    $("attendanceList").textContent="Chọn một buổi đá để điểm danh.";
    return;
  }

  const {data,error}=await db.from("attendance")
    .select("player_id,status,note")
    .eq("session_id",sid);

  if(error){
    $("attendanceList").textContent="Lỗi tải điểm danh: "+error.message;
    return;
  }

  attendanceData=data||[];
  renderAttendance();
}

function renderAttendance(){
  const saved=new Map(attendanceData.map(x=>[x.player_id,x.status]));
  const players=playerData.filter(p=>p.is_active);

  $("attendanceList").innerHTML="";

  if(!players.length){
    $("attendanceList").textContent="Chưa có cầu thủ đang hoạt động.";
    return;
  }

  players.forEach(p=>{
    const row=document.createElement("div");
    row.className="att-row";

    const name=document.createElement("strong");
    name.textContent=(p.jersey_number!=null?"#"+p.jersey_number+" ":"")+(p.full_name||"");

    const select=document.createElement("select");
    select.dataset.playerId=p.id;

    [
      ["present","Có mặt"],
      ["late","Có mặt trễ"],
      ["absent","Vắng mặt"]
    ].forEach(([v,t])=>select.add(new Option(t,v)));

    select.value=saved.get(p.id)||"present";

    row.append(name,select);
    $("attendanceList").append(row);
  });
}

let matchTeamA = new Set();
let matchTeamB = new Set();

function renderMatchPlayerOptions() {
  const a = $("teamAPlayers");
  const b = $("teamBPlayers");

  if (!a || !b) return;

  function renderList(container, team, otherTeam) {
    container.innerHTML = "";

    const available = playerData.filter(p =>
      p.is_active && (!otherTeam.has(p.id) || team.has(p.id))
    );

    if (!available.length) {
      container.textContent = "Chưa có cầu thủ phù hợp.";
      return;
    }

    available.forEach(p => {
      const label = document.createElement("label");
      label.style.cssText =
        "display:flex;align-items:center;gap:12px;padding:10px;margin:7px 0;background:#0c120e;border:1px solid #354238;border-radius:10px;cursor:pointer";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = team.has(p.id);
      checkbox.style.cssText = "width:20px;height:20px;margin:0;flex-shrink:0";

      checkbox.addEventListener("change", () => {
        const limit = $("matchFormat").value === "5v5" ? 5 : 7;

        if (checkbox.checked) {
          if (team.size >= limit) {
            checkbox.checked = false;
            message("matchMsg", "Mỗi đội chỉ được chọn tối đa " + limit + " cầu thủ.");
            return;
          }

          team.add(p.id);
          otherTeam.delete(p.id);
        } else {
          team.delete(p.id);
        }

        message("matchMsg", "");
        renderMatchPlayerOptions();
      });

      const img = document.createElement("img");
      img.src = p.photo_url || "";
      img.alt = "";
      img.style.cssText =
        "width:45px;height:45px;object-fit:cover;border-radius:8px;background:#303a32;flex-shrink:0";

      img.onerror = () => {
        img.style.display = "none";
      };

      const info = document.createElement("span");
      info.style.cssText = "flex:1;min-width:0;color:white;font-size:14px";

      const name = document.createElement("strong");
      name.textContent =
        (p.jersey_number != null ? "#" + p.jersey_number + " " : "") +
        p.full_name;

      info.appendChild(name);
      label.append(checkbox, img, info);
      container.appendChild(label);
    });
  }

  renderList(a, matchTeamA, matchTeamB);
  renderList(b, matchTeamB, matchTeamA);
}

$("matchFormat").addEventListener("change", () => {
  const limit = $("matchFormat").value === "5v5" ? 5 : 7;

  [matchTeamA, matchTeamB].forEach(team => {
    while (team.size > limit) {
      team.delete([...team].pop());
    }
  });

  message("matchMsg", "");
  renderMatchPlayerOptions();
});

async function loadMatchHistory() {
  const box = $("matchHistory");
  box.textContent = "Đang tải lịch sử trận đấu...";

  const { data, error } = await db
    .from("matches")
    .select("*")
    .order("match_date", { ascending: false })
    .limit(30);

  if (error) {
    box.textContent = "Không tải được lịch sử: " + error.message;
    return;
  }

  const { data: scorerData, error: scorerError } = await db
    .from("match_scorers")
    .select("match_id,player_id,goals,team");

  if (scorerError) {
    box.textContent = "Không tải được dữ liệu ghi bàn: " + scorerError.message;
    return;
  }

  const scorers = scorerData || [];

  box.innerHTML = "";

  // BẢNG XẾP HẠNG VUA PHÁ LƯỚI
  const totals = new Map();

  scorers.forEach(item => {
    const goals = Number(item.goals) || 0;
    if (goals <= 0) return;

    totals.set(
      item.player_id,
      (totals.get(item.player_id) || 0) + goals
    );
  });

  const ranking = [...totals.entries()]
    .map(([playerId, goals]) => ({
      player: playerData.find(p => p.id === playerId),
      goals
    }))
    .filter(x => x.player)
    .sort((a, b) => b.goals - a.goals);

  const rankingBox = document.createElement("div");
  rankingBox.className = "match-card";

  const rankingTitle = document.createElement("h3");
  rankingTitle.textContent = "🏆 VUA PHÁ LƯỚI OLD BOYS";
  rankingBox.appendChild(rankingTitle);

  if (!ranking.length) {
    const empty = document.createElement("div");
    empty.style.color = "#aaa";
    empty.textContent = "Chưa có cầu thủ ghi bàn.";
    rankingBox.appendChild(empty);
  } else {
    ranking.slice(0, 10).forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "goal-row";

      const name = document.createElement("span");
      name.className = "goal-name";
      name.textContent =
        (index + 1) + ". " +
        (item.player.jersey_number != null
          ? "#" + item.player.jersey_number + " "
          : "") +
        item.player.full_name;
      name.style.cursor="pointer";
      name.title="Bấm để xem hồ sơ cầu thủ";
      name.addEventListener("click",()=>openPlayerDetail(item.player));
      const count = document.createElement("strong");
      count.className = "goal-count";
      count.textContent = item.goals + " bàn";

      row.append(name, count);
      rankingBox.appendChild(row);
    });
  }

  box.appendChild(rankingBox);

  const heading = document.createElement("h3");
  heading.textContent = "LỊCH SỬ TRẬN ĐẤU";
  box.appendChild(heading);

  if (!data || !data.length) {
    box.append("Chưa có trận đấu nào.");
    return;
  }

  data.forEach(match => {
    const card = document.createElement("div");
    card.className = "match-card";

    const title = document.createElement("strong");
    title.textContent = match.title || "Trận đấu OLD BOYS";

    const date = document.createElement("div");
    date.style.cssText = "margin-top:7px;color:#aaa;font-size:13px";
    date.textContent =
      (match.match_date || "") +
      (match.start_time ? " · " + match.start_time.slice(0, 5) : "") +
      " · " + (match.format || match.match_format || "");

    const score = document.createElement("div");
    score.className = "match-card-score";

    const teamA = document.createElement("span");
    teamA.textContent = match.team_a_name || "ĐỘI A";

    const result = document.createElement("strong");
    result.textContent =
      (match.score_a ?? 0) + " - " + (match.score_b ?? 0);

    const teamB = document.createElement("span");
    teamB.textContent = match.team_b_name || "ĐỘI B";

    score.append(teamA, result, teamB);

    // DANH SÁCH CẦU THỦ GHI BÀN TRẬN NÀY
    const scorerBox = document.createElement("div");
    scorerBox.style.cssText =
      "margin:8px 0;padding:10px;background:#0c120e;border-radius:9px";

    const matchScorers = scorers.filter(x =>
      x.match_id === match.id && Number(x.goals) > 0
    );

    if (!matchScorers.length) {
      scorerBox.textContent = "Chưa có dữ liệu người ghi bàn.";
      scorerBox.style.color = "#89938b";
      scorerBox.style.fontSize = "12px";
    } else {
      matchScorers.forEach(item => {
        const player = playerData.find(p => p.id === item.player_id);
        if (!player) return;

        const line = document.createElement("div");
        line.style.cssText =
          "font-size:13px;padding:4px 0;color:#dce5dc";

        line.textContent =
          (item.team === "A" ? "A · " : "B · ") +
          (player.jersey_number != null
            ? "#" + player.jersey_number + " "
            : "") +
                    player.full_name + "  × " + item.goals;

        line.style.cursor="pointer";
        line.title="Bấm để xem hồ sơ cầu thủ";
        line.addEventListener("click",()=>openPlayerDetail(player));

        scorerBox.appendChild(line);
      });
    }

    const status = document.createElement("div");
    status.style.cssText = "margin-top:8px;color:#aaa;font-size:12px";
    status.textContent =
      match.status === "completed" ? "Đã hoàn thành" : "Chưa hoàn thành";

    const editButton = document.createElement("button");
    editButton.type = "button";
    editButton.textContent = "MỞ BẢNG TRẬN ĐẤU";
    editButton.style.cssText = "width:100%;margin-top:12px";
    editButton.addEventListener("click", () => {
      openMatchEditor(match, card);
    });

    card.append(title, date, score, scorerBox, status, editButton);
    box.appendChild(card);
  });
}

async function openMatchEditor(match, card) {
 const modal=$("matchDetailModal"), content=$("matchDetailContent");
 content.innerHTML="<p>Đang tải thông tin trận đấu...</p>";
 modal.classList.remove("hidden");

 const {data:assigned,error}=await db.from("match_players")
  .select("player_id,team").eq("match_id",match.id);

 if(error){content.textContent="Lỗi tải cầu thủ: "+error.message;return;}

 const {data:oldScorers,error:scorerError}=await db.from("match_scorers")
  .select("player_id,goals").eq("match_id",match.id);

 if(scorerError){content.textContent="Lỗi tải người ghi bàn: "+scorerError.message;return;}

 const oldGoals=new Map((oldScorers||[]).map(x=>[x.player_id,Number(x.goals)||0]));

 content.innerHTML="";

 const title=document.createElement("h2");
 title.textContent=match.title||"TRẬN ĐẤU OLD BOYS";

 const date=document.createElement("div");
 date.className="sub";
 date.textContent=(match.match_date||"")+" · "+(match.format||match.match_format||"");

 content.append(title,date);

 const board=document.createElement("div");
 board.className="score-live";

 const boxA=document.createElement("div");
 const boxB=document.createElement("div");
 const labelA=document.createElement("span");
 const labelB=document.createElement("span");

 labelA.textContent=match.team_a_name||"ĐỘI A";
 labelB.textContent=match.team_b_name||"ĐỘI B";

 const scoreA=document.createElement("strong");
 const scoreB=document.createElement("strong");

 scoreA.textContent=match.score_a??0;
 scoreB.textContent=match.score_b??0;

 boxA.append(labelA,scoreA);
 boxB.append(labelB,scoreB);
 board.append(boxA,boxB);
 content.appendChild(board);

 const heading=document.createElement("h3");
 heading.textContent="CHẠM + / − ĐỂ CẬP NHẬT BÀN THẮNG";
 content.appendChild(heading);

 const goals=[];

 const refresh=()=>{
  scoreA.textContent=goals.filter(x=>x.team==="A").reduce((n,x)=>n+x.value,0);
  scoreB.textContent=goals.filter(x=>x.team==="B").reduce((n,x)=>n+x.value,0);
 };

 (assigned||[]).forEach(item=>{
  const p=playerData.find(x=>x.id===item.player_id);
  if(!p)return;

  const row=document.createElement("div");
  row.className="goal-row";

  const name=document.createElement("span");
  name.className="goal-name";
  name.textContent=(item.team==="A"?"A · ":"B · ")+
   (p.jersey_number!=null?"#"+p.jersey_number+" ":"")+p.full_name;

  const minus=document.createElement("button");
  minus.type="button";
  minus.className="goal-btn minus";
  minus.textContent="−";

  const count=document.createElement("strong");
  count.className="goal-count";
  count.textContent=oldGoals.get(item.player_id)||0;

  const plus=document.createElement("button");
  plus.type="button";
  plus.className="goal-btn";
  plus.textContent="+";

  const entry={
   player_id:item.player_id,
   team:item.team,
   value:oldGoals.get(item.player_id)||0
  };

  minus.onclick=()=>{
   entry.value=Math.max(0,entry.value-1);
   count.textContent=entry.value;
   refresh();
  };

  plus.onclick=()=>{
   entry.value++;
   count.textContent=entry.value;
   refresh();
  };

  goals.push(entry);
  row.append(name,minus,count,plus);
  content.appendChild(row);
 });

 refresh();

 const save=document.createElement("button");
 save.type="button";
 save.textContent="LƯU KẾT QUẢ";
 save.style.cssText="width:100%;margin-top:16px";

 const msg=document.createElement("div");
 msg.className="message";

 save.onclick=async()=>{
  const score_a=goals.filter(x=>x.team==="A").reduce((n,x)=>n+x.value,0);
  const score_b=goals.filter(x=>x.team==="B").reduce((n,x)=>n+x.value,0);

  const scorers=goals.filter(x=>x.value>0).map(x=>({
   match_id:match.id,
   player_id:x.player_id,
   team:x.team,
   goals:x.value
  }));

  save.disabled=true;
  save.textContent="ĐANG LƯU...";

  try{
   const {error:u}=await db.from("matches")
    .update({score_a,score_b,status:"completed"})
    .eq("id",match.id);

   if(u)throw u;

   const {error:d}=await db.from("match_scorers")
    .delete().eq("match_id",match.id);

   if(d)throw d;

   if(scorers.length){
    const {error:i}=await db.from("match_scorers").insert(scorers);
    if(i)throw i;
   }

   await loadMatchHistory();
   modal.classList.add("hidden");

  }catch(err){
   msg.textContent="Không lưu được: "+err.message;
  }finally{
   save.disabled=false;
   save.textContent="LƯU KẾT QUẢ";
  }
 };

 content.append(save,msg);
}

$("createMatch").addEventListener("click", async () => {
  const button = $("createMatch");
  const title = $("matchTitle").value.trim();
  const date = $("matchDate").value;
  const time = $("matchTime").value;
  const teamAName = $("teamAName").value.trim() || "ĐỘI A";
  const teamBName = $("teamBName").value.trim() || "ĐỘI B";

  if (!title || !date) {
    message("matchMsg", "Vui lòng nhập tên trận và ngày đấu.");
    return;
  }

  if (!matchTeamA.size || !matchTeamB.size) {
    message("matchMsg", "Vui lòng chọn cầu thủ cho cả hai đội.");
    return;
  }

  button.disabled = true;
  button.textContent = "ĐANG LƯU...";

  try {
    const { data: match, error } = await db
      .from("matches")
      .insert({
        title: title,
        match_date: date,
        start_time: time || null,
        format: $("matchFormat").value,
match_format: $("matchFormat").value,
        team_a_name: teamAName,
        team_b_name: teamBName,
        score_a: 0,
        score_b: 0,
        status: "scheduled"
      })
      .select()
      .single();

    if (error) throw error;

    const players = [
      ...[...matchTeamA].map(id => ({
        match_id: match.id,
        player_id: id,
        team: "A"
      })),
      ...[...matchTeamB].map(id => ({
        match_id: match.id,
        player_id: id,
        team: "B"
      }))
    ];

    const { error: playerError } = await db
      .from("match_players")
      .insert(players);

    if (playerError) {
      await db.from("matches").delete().eq("id", match.id);
      throw playerError;
    }
$("createMatchModal").classList.add("hidden");
    matchTeamA.clear();
    matchTeamB.clear();
    renderMatchPlayerOptions();

    message("matchMsg", "Đã tạo và lưu trận đấu thành công!");
    await loadMatchHistory();

  } catch (error) {
    message("matchMsg", "Không lưu được trận đấu: " + error.message);
  } finally {
    button.disabled = false;
    button.textContent = "TẠO TRẬN ĐẤU";
  }
});

start();
